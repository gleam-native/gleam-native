[package]
name = "fuzzing-core"
description = "Gleam compiler fuzzing: crash probe, well-typed generator, differential normaliser"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
gleam-core = { path = "../compiler-core" }
erlang-generation = { path = "../erlang-generation" }
src-span = { path = "../src-span" }
camino.workspace = true
ecow.workspace = true
imbl.workspace = true
arbitrary = "1"
regex = { workspace = true }
