[package]
name = "native-runtime"
authors = ["Ivan Kachalkin <xikxp1@gmail.com>"]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# The single-threaded variant: dict structural sharing never crosses
# threads, so plain Rc reference counts beat im's atomic ones.
im-rc = "15"
# Inline storage for short strings: most Gleam strings fit the 24 inline
# bytes, skipping the separate buffer allocation entirely.
compact_str = "0.9"
libc = "0.2.189"
num-bigint.workspace = true
num-traits.workspace = true
unicode-segmentation.workspace = true
